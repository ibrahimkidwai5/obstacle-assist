<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obstacle Assist</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:-apple-system,system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  video,#draw{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hud{position:absolute;top:0;left:0;padding:10px 14px;font-size:11px;
    font-family:ui-monospace,monospace;line-height:1.5;white-space:pre;
    text-shadow:0 1px 3px #000;pointer-events:none;opacity:.85}
  #say{position:absolute;left:0;right:0;bottom:88px;text-align:center;
    font-size:clamp(24px,7vw,44px);font-weight:800;letter-spacing:-.5px;
    text-shadow:0 2px 16px #000;pointer-events:none;padding:0 16px}
  #bar{position:absolute;left:0;right:0;bottom:74px;height:6px;display:flex;gap:3px;
    padding:0 14px;pointer-events:none}
  #bar div{flex:1;border-radius:3px;background:#333;transition:background .2s}
  #controls{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  button{flex:1;padding:13px 2px;font-size:12px;font-weight:700;border:0;
    border-radius:11px;background:#23272e;color:#fff}
  button.on{background:#30d158;color:#000}
  button.busy{background:#ffbd2e;color:#000}
  #splash{position:absolute;inset:0;background:#000;z-index:9;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;text-align:center}
  #splash h1{margin:0;font-size:21px}
  #splash p{margin:0;max-width:320px;font-size:13px;color:#8e939a;line-height:1.5}
  #go{flex:none;padding:15px 46px;font-size:17px;background:#30d158;color:#000}
  #log{font-family:ui-monospace,monospace;font-size:10.5px;color:#6b7280;
    white-space:pre-wrap;line-height:1.6;max-height:34vh;overflow:auto}
  .ok{color:#30d158}.err{color:#ff5f56}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="draw"></canvas>
  <div id="hud"></div>
  <div id="say"></div>
  <div id="bar"><div></div><div></div><div></div></div>
  <div id="controls">
    <button id="bSpeak" class="on">Speech</button>
    <button id="bTone" class="on">Tone</button>
    <button id="bBoxes" class="on">Boxes</button>
    <button id="bDepth">Depth</button>
  </div>
  <div id="splash">
    <h1>Obstacle Assist</h1>
    <p>Speaks what is ahead and which way is clear.
       Hold upright at chest height, camera facing forward.</p>
    <button id="go">Start</button>
    <div id="log">Ready.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script>
<script>
// ===================== tunables =====================
const CFG = {
  warnArea:      0.12,
  minScore:      0.45,
  voteWindow:    12,
  voteMajority:  0.60,
  speakEveryMs:  2000,

  laneEnter:     0.07,   // box-area mode
  laneExit:      0.04,

  depthEnter:    0.55,   // depth mode, 0-1 nearness
  depthExit:     0.42,
  depthEveryN:   4,
  depthSize:     252,    // must be a multiple of 14
  depthBandTop:  0.45,

  laneSmooth:    0.25,
  commitMs:      2500
};

// 27 MB int8 build - the only quantized file in the -small repo
const DEPTH_URL =
  'https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_int8.onnx';

// ===================== elements =====================
const vid = document.getElementById('vid');
const cvs = document.getElementById('draw');
const ctx = cvs.getContext('2d');
const hud = document.getElementById('hud');
const sayEl = document.getElementById('say');
const lanesEl = [...document.querySelectorAll('#bar div')];
const logEl = document.getElementById('log');
const splash = document.getElementById('splash');
const bDepth = document.getElementById('bDepth');

const dcv = document.createElement('canvas');
dcv.width = CFG.depthSize; dcv.height = CFG.depthSize;
const dcx = dcv.getContext('2d', { willReadFrequently: true });

let model = null, running = false;
let depthSession = null, depthOn = false, depthBusy = false;
let depthLanes = null, depthMs = 0, depthEP = '';
let speakOn = true, toneOn = true, boxesOn = true;
let fps = 0, frameNo = 0;
let lastMsg = '', lastMsgAt = 0, lastState = '';
let blockedState = [false, false, false];
let laneAvg = [0, 0, 0];
let voteBuf = [];
let committedSide = null, committedAt = 0;

const log = (m, c='') => { logEl.innerHTML += `\n<span class="${c}">${m}</span>`;
                           logEl.scrollTop = 1e6; };

// ===================== speech =====================
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
  speechUnlocked = true;
}
function say(msg) {
  if (!speakOn || !window.speechSynthesis) return;
  const now = performance.now();
  if (now - lastMsgAt < CFG.speakEveryMs) return;
  if (speechSynthesis.speaking) return;
  const u = new SpeechSynthesisUtterance(msg);
  u.rate = 1.1; u.pitch = 1;
  speechSynthesis.speak(u);
  lastMsg = msg; lastMsgAt = now;
}

// ===================== tone =====================
let actx, osc, gain, panner, lfo, lfoGain;
function audioInit() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  osc = actx.createOscillator(); gain = actx.createGain();
  panner = actx.createStereoPanner(); lfo = actx.createOscillator();
  lfoGain = actx.createGain();
  osc.type = 'sine'; osc.frequency.value = 620;
  gain.gain.value = 0; lfo.frequency.value = 3; lfoGain.gain.value = 0;
  lfo.connect(lfoGain).connect(gain.gain);
  osc.connect(gain).connect(panner).connect(actx.destination);
  osc.start(); lfo.start();
  if (actx.state === 'suspended') actx.resume();
}
function tone(on, freq=620, pan=0, rate=3) {
  if (!actx) return;
  const t = actx.currentTime;
  if (!on || !toneOn) { gain.gain.setTargetAtTime(0,t,.06);
                        lfoGain.gain.setTargetAtTime(0,t,.06); return; }
  osc.frequency.setTargetAtTime(freq,t,.05);
  panner.pan.setTargetAtTime(pan,t,.05);
  lfo.frequency.setTargetAtTime(rate,t,.05);
  gain.gain.setTargetAtTime(.11,t,.06);
  lfoGain.gain.setTargetAtTime(.1,t,.06);
}

// ===================== depth =====================
async function loadDepth() {
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.simd = true;
  const eps = ('gpu' in navigator) ? ['webgpu', 'wasm'] : ['wasm'];
  depthSession = await ort.InferenceSession.create(DEPTH_URL, {
    executionProviders: eps,
    graphOptimizationLevel: 'all'
  });
  depthEP = eps[0];
}

function depthInput() {
  const S = CFG.depthSize;
  dcx.drawImage(vid, 0, 0, S, S);
  const px = dcx.getImageData(0, 0, S, S).data;
  const out = new Float32Array(3 * S * S);
  const mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225];
  const n = S * S;
  for (let i = 0; i < n; i++) {
    out[i]       = (px[i*4]   / 255 - mean[0]) / std[0];
    out[i + n]   = (px[i*4+1] / 255 - mean[1]) / std[1];
    out[i + 2*n] = (px[i*4+2] / 255 - mean[2]) / std[2];
  }
  return new ort.Tensor('float32', out, [1, 3, S, S]);
}

function lanesFromDepth(map, w, h) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < map.length; i++) {
    if (map[i] < lo) lo = map[i];
    if (map[i] > hi) hi = map[i];
  }
  const rng = (hi - lo) || 1;
  const y0 = Math.floor(h * CFG.depthBandTop);
  const out = [0, 0, 0];
  for (let L = 0; L < 3; L++) {
    const xa = Math.floor(L * w / 3), xb = Math.floor((L + 1) * w / 3);
    const vals = [];
    for (let y = y0; y < h; y += 2)
      for (let x = xa; x < xb; x += 2)
        vals.push((map[y * w + x] - lo) / rng);
    vals.sort();
    out[L] = vals.length ? vals[Math.floor(vals.length * 0.8)] : 0;
  }
  return out;
}

async function runDepth() {
  if (!depthSession || depthBusy) return;
  depthBusy = true;
  const t = performance.now();
  try {
    const feeds = {};
    feeds[depthSession.inputNames[0]] = depthInput();
    const res = await depthSession.run(feeds);
    const out = res[depthSession.outputNames[0]];
    const d = out.dims;
    const h = d[d.length - 2], w = d[d.length - 1];
    depthLanes = lanesFromDepth(out.data, w, h);
    depthMs = performance.now() - t;
  } catch (e) {
    console.warn('depth', e);
    log('Depth run failed: ' + e.message, 'err');
    depthOn = false; depthLanes = null;
    bDepth.classList.remove('on');
  }
  depthBusy = false;
}

// ============ scene logic (pure - portable to Python) ============
function rawLanes(preds, W, H) {
  const frameArea = W * H;
  const lanes = [0, 0, 0];
  let worst = null;
  for (const p of preds) {
    if (p.score < CFG.minScore) continue;
    const [x, y, w, h] = p.bbox;
    const area = (w * h) / frameArea;
    const cxn = (x + w / 2) / W;
    const l0 = Math.max(0, Math.floor((x / W) * 3));
    const l1 = Math.min(2, Math.floor(((x + w) / W) * 3));
    for (let i = l0; i <= l1; i++) lanes[i] += area;
    if (!worst || area > worst.area) worst = { label: p.class, area, cxn };
  }
  return { lanes, worst };
}

function adviceFrom(blocked, avg) {
  if (!blocked[1]) return null;
  if (!blocked[0] && !blocked[2]) return avg[0] <= avg[2] ? 'left' : 'right';
  if (!blocked[0]) return 'left';
  if (!blocked[2]) return 'right';
  return 'none';
}

function sideWord(cxn) { return cxn < 0.38 ? 'left' : cxn > 0.62 ? 'right' : 'ahead'; }

// ===================== main loop =====================
async function loop() {
  if (!running) return;
  const t0 = performance.now();
  frameNo++;

  let preds = [];
  try { preds = await model.detect(vid, 8); } catch(e) { console.warn(e); }

  const W = cvs.width, H = cvs.height;
  const { lanes, worst } = rawLanes(preds, W, H);

  if (depthOn && depthSession && frameNo % CFG.depthEveryN === 0) runDepth();

  const useDepth = depthOn && depthLanes;
  const src   = useDepth ? depthLanes    : lanes;
  const enter = useDepth ? CFG.depthEnter : CFG.laneEnter;
  const exit  = useDepth ? CFG.depthExit  : CFG.laneExit;

  laneAvg = laneAvg.map((v, i) => v * (1 - CFG.laneSmooth) + src[i] * CFG.laneSmooth);

  const blocked = laneAvg.map((a, i) => blockedState[i] ? a >= exit : a >= enter);
  blockedState = blocked;

  let advice = adviceFrom(blocked, laneAvg);
  if (advice === 'left' || advice === 'right') {
    const now = performance.now();
    if (committedSide && now - committedAt < CFG.commitMs) advice = committedSide;
    else { committedSide = advice; committedAt = now; }
  } else committedSide = null;

  // ---- draw ----
  ctx.clearRect(0,0,W,H);
  if (boxesOn) {
    for (const p of preds) {
      if (p.score < CFG.minScore) continue;
      const [x,y,w,h] = p.bbox;
      const a = (w*h)/(W*H);
      ctx.strokeStyle = a >= CFG.warnArea ? '#ffbd2e' : '#30d158';
      ctx.lineWidth = 3; ctx.strokeRect(x,y,w,h);
      ctx.fillStyle = ctx.strokeStyle; ctx.font = '600 15px system-ui';
      ctx.fillText(p.class, x+4, Math.max(15, y-5));
    }
  }
  lanesEl.forEach((el,i) =>
    el.style.background = blocked[i] ? '#ff5f56' : '#30d158');

  // ---- candidate state ----
  let state, msg;
  if (blocked[1] && advice && advice !== 'none') {
    state = 'divert';  msg = `Go ${advice}`;
  } else if (blocked[1]) {
    state = 'blocked'; msg = 'Blocked ahead';
  } else if (blocked[0] && blocked[2]) {
    state = 'sides';   msg = 'Obstacles both sides, centre clear';
  } else if (blocked[0]) {
    state = 'sideL';   msg = 'Obstacle left, keep right';
  } else if (blocked[2]) {
    state = 'sideR';   msg = 'Obstacle right, keep left';
  } else if (worst && worst.area >= CFG.warnArea) {
    state = 'note';    msg = `${worst.label} ${sideWord(worst.cxn)}`;
  } else {
    state = 'clear';   msg = 'Clear';
  }

  // ---- majority vote ----
  voteBuf.push({ state, msg });
  if (voteBuf.length > CFG.voteWindow) voteBuf.shift();
  const tally = {};
  for (const v of voteBuf) tally[v.state] = (tally[v.state] || 0) + 1;
  let winner = null, best = 0;
  for (const k in tally) if (tally[k] > best) { best = tally[k]; winner = k; }

  if (voteBuf.length >= CFG.voteWindow && best / voteBuf.length >= CFG.voteMajority) {
    lastState = winner;
    msg = [...voteBuf].reverse().find(v => v.state === winner).msg;
    if (winner !== 'clear') say(msg);
  }
  sayEl.textContent = (lastState === 'clear') ? '' : msg;

  // ---- tone ----
  if (worst && worst.area >= CFG.warnArea) {
    const t = Math.min(1, worst.area / 0.30);
    tone(true, 420 + t*820, (worst.cxn*2-1), 2 + t*10);
  } else tone(false);

  // ---- hud ----
  const ms = performance.now() - t0;
  fps = fps ? fps*.85 + (1000/ms)*.15 : 1000/ms;
  hud.textContent =
    `${fps.toFixed(1)} fps  ${ms.toFixed(0)} ms  ${tf.getBackend()}` +
      (useDepth ? `  depth ${depthMs.toFixed(0)}ms ${depthEP}` : '  depth off') + `\n` +
    `${preds.filter(p=>p.score>=CFG.minScore).length} obj  ${lastState}  ` +
    `L${laneAvg[0].toFixed(2)} C${laneAvg[1].toFixed(2)} R${laneAvg[2].toFixed(2)}` +
    (useDepth ? '  [depth]' : '  [boxes]');

  requestAnimationFrame(loop);
}

// ===================== start =====================
document.getElementById('go').onclick = async () => {
  const b = document.getElementById('go');
  b.disabled = true; b.textContent = 'Starting...';
  try {
    unlockSpeech();
    audioInit();

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:640}, height:{ideal:480} },
      audio:false });
    vid.srcObject = stream;
    await vid.play();
    await new Promise(res => vid.readyState >= 2 ? res() : vid.onloadeddata = res);
    cvs.width = vid.videoWidth; cvs.height = vid.videoHeight;
    log(`Camera ${cvs.width}x${cvs.height}`, 'ok');

    await tf.setBackend('webgl'); await tf.ready();
    log(`Backend: ${tf.getBackend()}`, 'ok');

    log('Loading detector...');
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    log('Ready. Tap Depth to add wall detection.', 'ok');

    splash.style.display = 'none';
    running = true;
    loop();
  } catch(e) {
    log('FAILED: ' + e.message, 'err');
    b.disabled = false; b.textContent = 'Retry';
  }
};

document.getElementById('bSpeak').onclick = e => {
  speakOn = !speakOn; e.target.classList.toggle('on', speakOn);
  if (!speakOn) speechSynthesis.cancel();
};
document.getElementById('bTone').onclick = e => {
  toneOn = !toneOn; e.target.classList.toggle('on', toneOn);
};
document.getElementById('bBoxes').onclick = e => {
  boxesOn = !boxesOn; e.target.classList.toggle('on', boxesOn);
};
bDepth.onclick = async () => {
  if (depthOn) {
    depthOn = false; depthLanes = null;
    bDepth.classList.remove('on');
    laneAvg = [0,0,0]; blockedState = [false,false,false];
    return;
  }
  if (!depthSession) {
    bDepth.classList.add('busy'); bDepth.textContent = '...';
    try {
      await loadDepth();
      bDepth.textContent = 'Depth';
    } catch (e) {
      bDepth.classList.remove('busy'); bDepth.textContent = 'Failed';
      alert('Depth load failed: ' + e.message);
      console.warn(e);
      return;
    }
    bDepth.classList.remove('busy');
  }
  depthOn = true; depthLanes = null;
  laneAvg = [0,0,0]; blockedState = [false,false,false];
  bDepth.classList.add('on');
};
</script>
</body>
</html>
