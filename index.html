<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obstacle Assist</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0b0d10;color:#e8eaed;overflow:hidden;
       font-family:-apple-system,system-ui,sans-serif}
  #stage{position:relative;width:100vw;height:100vh;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #draw{position:absolute;inset:0;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;
       background:linear-gradient(#000b,#0000);font-size:12px;
       font-family:ui-monospace,monospace;line-height:1.6;pointer-events:none;
       text-shadow:0 1px 3px #000;white-space:pre}
  #big{position:absolute;bottom:100px;left:0;right:0;text-align:center;
       font-size:30px;font-weight:700;text-shadow:0 2px 12px #000;pointer-events:none}
  #controls{position:absolute;bottom:0;left:0;right:0;
            padding:12px 14px calc(12px + env(safe-area-inset-bottom));
            display:flex;gap:8px;background:linear-gradient(#0000,#000c)}
  button{flex:1;padding:14px 6px;font-size:14px;font-weight:600;border:0;
         border-radius:12px;background:#22262c;color:#e8eaed}
  button:active{background:#33383f}
  button.on{background:#34d058;color:#000}
  #splash{position:absolute;inset:0;background:#0b0d10;z-index:20;display:flex;
          flex-direction:column;align-items:center;justify-content:center;
          gap:16px;padding:28px;text-align:center}
  h1{margin:0;font-size:22px}
  #splash p{margin:0;font-size:14px;color:#9aa0a6;max-width:330px;line-height:1.5}
  #start{flex:none;padding:16px 44px;font-size:17px;background:#34d058;color:#000}
  #status{font-family:ui-monospace,monospace;font-size:11px;color:#6b7280;
          white-space:pre-wrap;line-height:1.6;max-height:40vh;overflow:auto}
  .ok{color:#34d058}.warn{color:#fbbf24}.err{color:#f87171}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="draw"></canvas>
  <div id="hud"></div>
  <div id="big"></div>
  <div id="controls">
    <button id="bSound" class="on">Sound</button>
    <button id="bSpeech" class="on">Speech</button>
    <button id="bDepth">Load depth</button>
  </div>
  <div id="splash">
    <h1>Obstacle Assist</h1>
    <p>Detects obstacles ahead using the rear camera and signals them by tone and
       speech. Hold upright at chest height.</p>
    <button id="start">Start</button>
    <div id="status">Ready.</div>
  </div>
</div>

<script type="module">
import { pipeline, RawImage, env } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6";
env.allowLocalModels = false;

// ------------------------------------------------------------------ config
const CFG = {
  procW: 320, procH: 240,        // model input size - keep small for memory
  hfovDeg: 68,
  nearFrac: 0.55,                // box height / frame height counted as "very close"
  warnFrac: 0.25,                // ...as "worth warning about"
  speakMs: 3500,
  named: new Set(["person","chair","car","bicycle","motorcycle","dog","bench",
    "potted plant","couch","dining table","tv","backpack","suitcase","bus",
    "truck","traffic light","stop sign","fire hydrant","door","stairs"]),
};

const vid = document.getElementById("vid");
const cv  = document.getElementById("draw");
const cx  = cv.getContext("2d");
const hud = document.getElementById("hud");
const big = document.getElementById("big");
const statusEl = document.getElementById("status");
const splash = document.getElementById("splash");

// single reusable offscreen canvas - never allocate per frame
const work = document.createElement("canvas");
work.width = CFG.procW; work.height = CFG.procH;
const wcx = work.getContext("2d", { willReadFrequently: true });

let detector = null, depther = null, device = "wasm";
let running = false, busy = false, depthBusy = false;
let depthData = null, depthW = 0, depthH = 0;
let frameNo = 0, fps = 0, lastSpoke = 0, lastMsg = "";
let soundOn = true, speechOn = true;

const log = (m, c = "") => {
  statusEl.innerHTML += `\n<span class="${c}">${m}</span>`;
  statusEl.scrollTop = 1e6;
};

// ------------------------------------------------------------------ audio
let actx = null, osc = null, gain = null, pan = null, lfo = null, lfoGain = null;
function audioInit() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  osc = actx.createOscillator(); gain = actx.createGain();
  pan = actx.createStereoPanner(); lfo = actx.createOscillator();
  lfoGain = actx.createGain();
  osc.type = "sine"; osc.frequency.value = 600;
  gain.gain.value = 0; lfo.frequency.value = 3; lfoGain.gain.value = 0;
  lfo.connect(lfoGain).connect(gain.gain);
  osc.connect(gain).connect(pan).connect(actx.destination);
  osc.start(); lfo.start();
}
function tone(active, freq = 600, p = 0, rate = 3) {
  if (!actx) return;
  const t = actx.currentTime;
  if (!active || !soundOn) {
    gain.gain.setTargetAtTime(0, t, .05);
    lfoGain.gain.setTargetAtTime(0, t, .05);
    return;
  }
  osc.frequency.setTargetAtTime(freq, t, .04);
  pan.pan.setTargetAtTime(p, t, .04);
  lfo.frequency.setTargetAtTime(rate, t, .04);
  gain.gain.setTargetAtTime(.13, t, .05);
  lfoGain.gain.setTargetAtTime(.12, t, .05);
}
function speak(msg) {
  if (!speechOn || !window.speechSynthesis) return;
  const now = performance.now();
  if (now - lastSpoke < CFG.speakMs || msg === lastMsg) return;
  const u = new SpeechSynthesisUtterance(msg);
  u.rate = 1.15;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  lastSpoke = now; lastMsg = msg;
}

// ------------------------------------------------- scene logic (portable)
export function bearingDeg(cxPix, width, hfov) {
  return ((cxPix / width) * 2 - 1) * (hfov / 2);
}
export function proximityFromHeight(boxH, frameH) {
  // crude monocular proxy: taller in frame == nearer
  return Math.min(1, boxH / (frameH * CFG.nearFrac));
}
export function directionWord(n) {
  return n < 0.35 ? "left" : n > 0.65 ? "right" : "ahead";
}
export function alertFor(prox, bearDeg) {
  if (prox < CFG.warnFrac / CFG.nearFrac) return { active: false };
  return {
    active: true,
    freq: 400 + prox * 900,
    rate: 2 + prox * 9,
    pan: Math.max(-1, Math.min(1, bearDeg / (CFG.hfovDeg / 2))),
  };
}

// ------------------------------------------------------------------ frames
function grabRaw() {
  wcx.drawImage(vid, 0, 0, CFG.procW, CFG.procH);
  const d = wcx.getImageData(0, 0, CFG.procW, CFG.procH);
  return new RawImage(d.data, CFG.procW, CFG.procH, 4);
}

async function refreshDepth() {
  if (!depther || depthBusy) return;
  depthBusy = true;
  try {
    const out = await depther(grabRaw());
    const raw = out.predicted_depth ?? out.depth;
    const arr = raw.data ?? raw;
    depthW = raw.width || CFG.procW;
    depthH = raw.height || CFG.procH;
    depthData = arr instanceof Float32Array ? arr : Float32Array.from(arr);
  } catch (e) { console.warn("depth", e); }
  depthBusy = false;
}

// ------------------------------------------------------------------ loop
async function loop() {
  if (!running) return;
  const t0 = performance.now();
  frameNo++;

  if (!busy) {
    busy = true;
    let dets = [];
    try {
      dets = await detector(grabRaw(), { threshold: 0.35, percentage: true });
    } catch (e) { console.warn(e); }
    busy = false;

    if (depther && frameNo % 6 === 0) refreshDepth();

    // draw
    cx.clearRect(0, 0, cv.width, cv.height);
    const list = dets.map(d => {
      const b = d.box;
      const x = b.xmin * cv.width, y = b.ymin * cv.height;
      const w = (b.xmax - b.xmin) * cv.width, h = (b.ymax - b.ymin) * cv.height;
      return { label: d.label, x, y, w, h,
               prox: proximityFromHeight(h, cv.height),
               bear: bearingDeg(x + w / 2, cv.width, CFG.hfovDeg) };
    }).sort((a, b) => b.prox - a.prox);

    for (const o of list.slice(0, 6)) {
      cx.strokeStyle = o.prox > .7 ? "#f87171" : o.prox > .4 ? "#fbbf24" : "#34d058";
      cx.lineWidth = 3;
      cx.strokeRect(o.x, o.y, o.w, o.h);
      cx.fillStyle = cx.strokeStyle;
      cx.font = "600 15px system-ui";
      cx.fillText(o.label, o.x + 4, Math.max(16, o.y - 5));
    }

    const near = list[0];
    if (near) {
      const a = alertFor(near.prox, near.bear);
      tone(a.active, a.freq, a.pan, a.rate);
      if (a.active && CFG.named.has(near.label)) {
        const side = directionWord(near.bear / CFG.hfovDeg + .5);
        speak(`${near.label} ${side}`);
      }
      big.textContent = a.active ? `${near.label} ${directionWord(near.bear / CFG.hfovDeg + .5)}` : "";
    } else { tone(false); big.textContent = ""; }

    const ms = performance.now() - t0;
    fps = fps ? fps * .9 + (1000 / ms) * .1 : 1000 / ms;
    hud.textContent =
      `${fps.toFixed(1)} fps  ${ms.toFixed(0)} ms  ${device}\n` +
      `${dets.length} objects  ${depther ? "depth on" : "detection only"}`;
  }
  requestAnimationFrame(loop);
}

// ------------------------------------------------------------------ start
document.getElementById("start").onclick = async () => {
  const b = document.getElementById("start");
  b.disabled = true; b.textContent = "Starting...";
  try {
    audioInit();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" },
               width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    vid.srcObject = stream;
    await vid.play();
    cv.width = 640; cv.height = 480;
    log(`Camera ${vid.videoWidth}x${vid.videoHeight}`, "ok");

    if ("gpu" in navigator) {
      try { if (await navigator.gpu.requestAdapter()) device = "webgpu"; } catch {}
    }
    log(`Backend: ${device}`, device === "webgpu" ? "ok" : "warn");

    log("Loading detector (~25 MB)...");
    detector = await pipeline("object-detection", "Xenova/yolos-tiny",
                              { device, dtype: "q8" });
    log("Ready.", "ok");

    splash.style.display = "none";
    running = true;
    loop();
  } catch (e) {
    log("FAILED: " + e.message, "err");
    b.disabled = false; b.textContent = "Retry";
  }
};

document.getElementById("bSound").onclick = e => {
  soundOn = !soundOn; e.target.classList.toggle("on", soundOn);
};
document.getElementById("bSpeech").onclick = e => {
  speechOn = !speechOn; e.target.classList.toggle("on", speechOn);
};
document.getElementById("bDepth").onclick = async e => {
  if (depther) { depther = null; depthData = null; e.target.classList.remove("on");
                 return; }
  e.target.textContent = "Loading...";
  try {
    depther = await pipeline("depth-estimation", "Xenova/depth-anything-small-hf",
                             { device, dtype: "q8" });
    e.target.textContent = "Depth"; e.target.classList.add("on");
  } catch (err) {
    e.target.textContent = "Depth failed";
    console.warn(err);
  }
};
</script>
</body>
</html>
