<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obstacle Assist</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:-apple-system,system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  video,#draw{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hud{position:absolute;top:0;left:0;padding:10px 14px;font-size:11px;
    font-family:ui-monospace,monospace;line-height:1.5;white-space:pre;
    text-shadow:0 1px 3px #000;pointer-events:none;opacity:.85}
  #say{position:absolute;left:0;right:0;bottom:88px;text-align:center;
    font-size:clamp(20px,5.5vw,38px);font-weight:800;letter-spacing:-.5px;
    text-shadow:0 2px 16px #000;pointer-events:none;padding:0 16px}
  #say.wall{color:#ff5f56}
  #bar{position:absolute;left:0;right:0;bottom:74px;height:6px;display:flex;gap:3px;
    padding:0 14px;pointer-events:none}
  #bar div{flex:1;border-radius:3px;background:#333;transition:background .2s}
  #controls{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  button{flex:1;padding:13px 2px;font-size:12px;font-weight:700;border:0;
    border-radius:11px;background:#23272e;color:#fff}
  button.on{background:#30d158;color:#000}
  button.busy{background:#ffbd2e;color:#000}
  #splash{position:absolute;inset:0;background:#000;z-index:9;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;text-align:center}
  #splash h1{margin:0;font-size:21px}
  #splash p{margin:0;max-width:320px;font-size:13px;color:#8e939a;line-height:1.5}
  #go{flex:none;padding:15px 46px;font-size:17px;background:#30d158;color:#000}
  #log{font-family:ui-monospace,monospace;font-size:10.5px;color:#6b7280;
    white-space:pre-wrap;line-height:1.6;max-height:34vh;overflow:auto}
  .ok{color:#30d158}.err{color:#ff5f56}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="draw"></canvas>
  <div id="hud"></div>
  <div id="say"></div>
  <div id="bar"><div></div><div></div><div></div></div>
  <div id="controls">
    <button id="bSpeak" class="on">Speech</button>
    <button id="bTone" class="on">Tone</button>
    <button id="bBoxes" class="on">Boxes</button>
    <button id="bDepth">Depth</button>
  </div>
  <div id="splash">
    <h1>Obstacle Assist</h1>
    <p>Speaks what is ahead and which way is clear.
       Hold upright at chest height, camera facing forward.</p>
    <button id="go">Start</button>
    <div id="log">Ready.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script>
<script>
// ===================== tunables =====================
const CFG = {
  minScore:      0.40,
  voteWindow:    12,
  voteMajority:  0.60,
  speakEveryMs:  2000,

  laneEnter:     0.07,    // box-area mode (depth off)
  laneExit:      0.04,
  warnArea:      0.10,

  depthEnter:    0.80,    // depth mode: lane blocked above this nearness
  depthExit:     0.70,
  depthNear:     0.68,
  depthEveryN:   4,
  depthSize:     252,     // multiple of 14
  depthBandTop:  0.45,

  // ---- WALL DETECTION ----
  // A wall is a plane that FACES you: flat fit AND little depth gradient.
  // A floor is also a plane, but steeply tilted (near at the bottom of frame),
  // so the gradient check is what separates the two.
  planarR2:      0.72,    // how well a plane explains the depth
  gradMaxY:      0.32,    // |dz/dy| above this = floor or ceiling, not a wall
  gradMaxX:      0.32,    // |dz/dx| above this = wall seen at an angle
  planarNear:    0.42,    // the plane must be reasonably close
  flatFrames:    2,

  nameStickyMs:  2500,    // remember a lane's object name this long

  laneSmooth:    0.25,
  commitMs:      2500
};

const DEPTH_URLS = [
  'https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_q4f16.onnx',
  'https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx'
];

// ===================== elements =====================
const vid = document.getElementById('vid');
const cvs = document.getElementById('draw');
const ctx = cvs.getContext('2d');
const hud = document.getElementById('hud');
const sayEl = document.getElementById('say');
const lanesEl = [...document.querySelectorAll('#bar div')];
const logEl = document.getElementById('log');
const splash = document.getElementById('splash');
const bDepth = document.getElementById('bDepth');

const dcv = document.createElement('canvas');
dcv.width = CFG.depthSize; dcv.height = CFG.depthSize;
const dcx = dcv.getContext('2d', { willReadFrequently: true });

let model = null, running = false;
let depthSession = null, depthOn = false, depthBusy = false;
let depthLanes = null, depthMs = 0, depthTag = '';
let depthMap = null, depthW = 0, depthH = 0;
let planarFit = 0, planarLevel = 0, gradX = 0, gradY = 0;
let flatCount = 0, isWall = false;
let speakOn = true, toneOn = true, boxesOn = true;
let fps = 0, frameNo = 0;
let lastMsg = '', lastMsgAt = 0, lastState = '';
let blockedState = [false, false, false];
let laneAvg = [0, 0, 0];
let voteBuf = [];
let committedSide = null, committedAt = 0;
let objCount = 0;

// sticky per-lane object names, so a one-frame detection dropout
// doesn't turn "Chair left" back into "Obstacle left"
let laneName = [null, null, null];
let laneNameAt = [0, 0, 0];

const log = (m, c='') => { logEl.innerHTML += `\n<span class="${c}">${m}</span>`;
                           logEl.scrollTop = 1e6; };

// ===================== speech =====================
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
  speechUnlocked = true;
}
function say(msg) {
  if (!speakOn || !window.speechSynthesis) return;
  const now = performance.now();
  if (now - lastMsgAt < CFG.speakEveryMs) return;
  if (speechSynthesis.speaking) return;
  const u = new SpeechSynthesisUtterance(msg);
  u.rate = 1.1; u.pitch = 1;
  speechSynthesis.speak(u);
  lastMsg = msg; lastMsgAt = now;
}

// ===================== tone =====================
let actx, osc, gain, panner, lfo, lfoGain;
function audioInit() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  osc = actx.createOscillator(); gain = actx.createGain();
  panner = actx.createStereoPanner(); lfo = actx.createOscillator();
  lfoGain = actx.createGain();
  osc.type = 'sine'; osc.frequency.value = 620;
  gain.gain.value = 0; lfo.frequency.value = 3; lfoGain.gain.value = 0;
  lfo.connect(lfoGain).connect(gain.gain);
  osc.connect(gain).connect(panner).connect(actx.destination);
  osc.start(); lfo.start();
  if (actx.state === 'suspended') actx.resume();
}
function tone(on, freq=620, pan=0, rate=3) {
  if (!actx) return;
  const t = actx.currentTime;
  if (!on || !toneOn) { gain.gain.setTargetAtTime(0,t,.06);
                        lfoGain.gain.setTargetAtTime(0,t,.06); return; }
  osc.frequency.setTargetAtTime(freq,t,.05);
  panner.pan.setTargetAtTime(pan,t,.05);
  lfo.frequency.setTargetAtTime(rate,t,.05);
  gain.gain.setTargetAtTime(.11,t,.06);
  lfoGain.gain.setTargetAtTime(.1,t,.06);
}

// ===================== depth =====================
async function loadDepth() {
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.simd = true;
  const eps = ('gpu' in navigator) ? ['webgpu', 'wasm'] : ['wasm'];
  let lastErr = null;
  for (const url of DEPTH_URLS) {
    const tag = url.split('/').pop();
    try {
      log(`Trying ${tag}...`);
      depthSession = await ort.InferenceSession.create(url, {
        executionProviders: eps, graphOptimizationLevel: 'all' });
      depthTag = tag.replace('model_','').replace('.onnx','');
      log(`Depth ready (${depthTag})`, 'ok');
      return;
    } catch (e) {
      lastErr = e; log(`${tag} failed: ${e.message}`, 'err'); depthSession = null;
    }
  }
  throw lastErr || new Error('no depth model loaded');
}

function depthInput() {
  const S = CFG.depthSize;
  dcx.drawImage(vid, 0, 0, S, S);
  const px = dcx.getImageData(0, 0, S, S).data;
  const out = new Float32Array(3 * S * S);
  const mean = [0.485,0.456,0.406], std = [0.229,0.224,0.225];
  const n = S * S;
  for (let i = 0; i < n; i++) {
    out[i]       = (px[i*4]   / 255 - mean[0]) / std[0];
    out[i + n]   = (px[i*4+1] / 255 - mean[1]) / std[1];
    out[i + 2*n] = (px[i*4+2] / 255 - mean[2]) / std[2];
  }
  return new ort.Tensor('float32', out, [1, 3, S, S]);
}

/* Fit z = a*x + b*y + c over the view.
   Returns R^2 plus the gradients a (horizontal) and b (vertical).
   Wall facing you : R2 high, a and b both near 0
   Floor           : R2 high, b large  <- this is what we must reject
   Room with stuff : R2 low                                            */
function planeFit(norm, w, h) {
  let n=0, sx=0, sy=0, sz=0, sxx=0, sxy=0, syy=0, sxz=0, syz=0;
  for (let y = 0; y < h; y += 3) {
    for (let x = 0; x < w; x += 3) {
      const X = x / w, Y = y / h, Z = norm[y * w + x];
      n++; sx+=X; sy+=Y; sz+=Z;
      sxx+=X*X; sxy+=X*Y; syy+=Y*Y; sxz+=X*Z; syz+=Y*Z;
    }
  }
  if (n < 12) return { r2: 0, a: 0, b: 0 };
  const m = [[sxx,sxy,sx],[sxy,syy,sy],[sx,sy,n]];
  const v = [sxz,syz,sz];
  const det =
    m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1]) -
    m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0]) +
    m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  if (Math.abs(det) < 1e-12) return { r2: 0, a: 0, b: 0 };
  const inv = (r,c) => {
    const i1=(r+1)%3, i2=(r+2)%3, j1=(c+1)%3, j2=(c+2)%3;
    return (m[j1][i1]*m[j2][i2]-m[j1][i2]*m[j2][i1]) / det;
  };
  const a = inv(0,0)*v[0]+inv(0,1)*v[1]+inv(0,2)*v[2];
  const b = inv(1,0)*v[0]+inv(1,1)*v[1]+inv(1,2)*v[2];
  const c = inv(2,0)*v[0]+inv(2,1)*v[1]+inv(2,2)*v[2];

  const mean = sz / n;
  let ssRes = 0, ssTot = 0;
  for (let y = 0; y < h; y += 3) {
    for (let x = 0; x < w; x += 3) {
      const X = x / w, Y = y / h, Z = norm[y * w + x];
      const p = a*X + b*Y + c;
      ssRes += (Z-p)*(Z-p);
      ssTot += (Z-mean)*(Z-mean);
    }
  }
  const r2 = ssTot < 1e-9 ? 1 : Math.max(0, 1 - ssRes/ssTot);
  return { r2, a, b };
}

function analyseDepth(map, w, h) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < map.length; i++) {
    if (map[i] < lo) lo = map[i];
    if (map[i] > hi) hi = map[i];
  }
  const rng = (hi - lo) || 1;
  const norm = new Float32Array(map.length);
  for (let i = 0; i < map.length; i++) norm[i] = (map[i] - lo) / rng;

  const y0 = Math.floor(h * CFG.depthBandTop);
  const lanes = [[], [], []];
  let sum = 0, cnt = 0;
  for (let y = y0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      const v = norm[y * w + x];
      lanes[Math.min(2, Math.floor((x / w) * 3))].push(v);
      sum += v; cnt++;
    }
  }
  const out = lanes.map(v => {
    if (!v.length) return 0;
    v.sort();
    return v[Math.floor(v.length * 0.8)];
  });

  const pf = planeFit(norm, w, h);
  return { lanes: out, norm, fit: pf.r2, gx: pf.a, gy: pf.b,
           level: cnt ? sum/cnt : 0 };
}

function depthOfBox(box, W, H) {
  if (!depthMap) return null;
  const [x, y, w, h] = box;
  const sx = depthW / W, sy = depthH / H;
  let x1 = Math.round((x + w*0.2) * sx), x2 = Math.round((x + w*0.8) * sx);
  let y1 = Math.round((y + h*0.2) * sy), y2 = Math.round((y + h*0.8) * sy);
  x1 = Math.max(0, x1); x2 = Math.min(depthW, x2);
  y1 = Math.max(0, y1); y2 = Math.min(depthH, y2);
  if (x2 <= x1 || y2 <= y1) return null;
  const vals = [];
  for (let yy = y1; yy < y2; yy += 2)
    for (let xx = x1; xx < x2; xx += 2) vals.push(depthMap[yy * depthW + xx]);
  if (!vals.length) return null;
  vals.sort();
  return vals[Math.floor(vals.length * 0.8)];
}

async function runDepth() {
  if (!depthSession || depthBusy) return;
  depthBusy = true;
  const t = performance.now();
  try {
    const feeds = {};
    feeds[depthSession.inputNames[0]] = depthInput();
    const res = await depthSession.run(feeds);
    const out = res[depthSession.outputNames[0]];
    const d = out.dims;
    const h = d[d.length-2], w = d[d.length-1];
    const a = analyseDepth(out.data, w, h);

    depthLanes = a.lanes;
    depthMap = a.norm; depthW = w; depthH = h;
    planarFit = a.fit; planarLevel = a.level;
    gradX = a.gx; gradY = a.gy;

    // wall = planar AND fronto-parallel AND close.
    // The gradient test is what rejects floors and ceilings.
    const wallish = planarFit >= CFG.planarR2 &&
                    Math.abs(gradY) <= CFG.gradMaxY &&
                    Math.abs(gradX) <= CFG.gradMaxX &&
                    planarLevel >= CFG.planarNear;
    if (wallish) flatCount++; else flatCount = 0;
    isWall = flatCount >= CFG.flatFrames;

    depthMs = performance.now() - t;
  } catch (e) {
    console.warn('depth', e);
    log('Depth run failed: ' + e.message, 'err');
    depthOn = false; depthLanes = null; depthMap = null; isWall = false;
    bDepth.classList.remove('on');
  }
  depthBusy = false;
}

// ============ scene logic (pure - portable to Python) ============
function analyseObjects(preds, W, H, useDepth) {
  const frameArea = W * H;
  const lanes = [0, 0, 0];
  const items = [];
  let worst = null;

  for (const p of preds) {
    if (p.score < CFG.minScore) continue;
    const [x, y, w, h] = p.bbox;
    const area = (w * h) / frameArea;
    const cxn = (x + w / 2) / W;
    const near = useDepth ? depthOfBox(p.bbox, W, H) : null;

    const l0 = Math.max(0, Math.floor((x / W) * 3));
    const l1 = Math.min(2, Math.floor(((x + w) / W) * 3));
    for (let i = l0; i <= l1; i++) lanes[i] += area;

    const item = { label: p.class, area, cxn, near, l0, l1, box: p.bbox };
    items.push(item);

    const score = (near != null) ? near : area;
    if (!worst || score > worst.score) worst = { ...item, score };
  }
  return { lanes, items, worst };
}

// refresh sticky names, then read them back
function updateLaneNames(items) {
  const now = performance.now();
  for (let L = 0; L < 3; L++) {
    let best = null;
    for (const it of items) {
      if (L < it.l0 || L > it.l1) continue;
      const s = (it.near != null) ? it.near : it.area;
      if (!best || s > best.s) best = { s, label: it.label };
    }
    if (best) { laneName[L] = best.label; laneNameAt[L] = now; }
    else if (now - laneNameAt[L] > CFG.nameStickyMs) laneName[L] = null;
  }
}

function adviceFrom(blocked) {
  if (!blocked[1]) return null;
  if (!blocked[0] && !blocked[2]) return 'both';
  if (!blocked[0]) return 'left';
  if (!blocked[2]) return 'right';
  return 'none';
}

function sideWord(cxn) { return cxn < 0.38 ? 'left' : cxn > 0.62 ? 'right' : 'ahead'; }
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

// ===================== main loop =====================
async function loop() {
  if (!running) return;
  const t0 = performance.now();
  frameNo++;

  let preds = [];
  try { preds = await model.detect(vid, 8); } catch(e) { console.warn(e); }

  const W = cvs.width, H = cvs.height;

  if (depthOn && depthSession && frameNo % CFG.depthEveryN === 0) runDepth();

  const useDepth = depthOn && depthLanes && depthMap;
  const { lanes, items, worst } = analyseObjects(preds, W, H, useDepth);
  objCount = items.length;
  updateLaneNames(items);

  const src   = useDepth ? depthLanes     : lanes;
  const enter = useDepth ? CFG.depthEnter : CFG.laneEnter;
  const exit  = useDepth ? CFG.depthExit  : CFG.laneExit;

  laneAvg = laneAvg.map((v,i) => v * (1 - CFG.laneSmooth) + src[i] * CFG.laneSmooth);
  let blocked = laneAvg.map((a,i) => blockedState[i] ? a >= exit : a >= enter);

  const wallNow = useDepth && isWall;
  if (wallNow) blocked = [true, true, true];
  blockedState = blocked;

  let advice = wallNow ? 'none' : adviceFrom(blocked);
  if (advice === 'left' || advice === 'right') {
    const now = performance.now();
    if (committedSide && now - committedAt < CFG.commitMs) advice = committedSide;
    else { committedSide = advice; committedAt = now; }
  } else committedSide = null;

  const worstNear = worst
    ? (worst.near != null ? worst.near >= CFG.depthNear : worst.area >= CFG.warnArea)
    : false;

  // ---- draw ----
  ctx.clearRect(0,0,W,H);
  if (boxesOn) {
    for (const it of items) {
      const [x,y,w,h] = it.box;
      let colour;
      if (it.near != null)
        colour = it.near >= CFG.depthNear ? '#ff5f56'
               : it.near >= CFG.depthNear - 0.15 ? '#ffbd2e' : '#30d158';
      else
        colour = it.area >= CFG.warnArea ? '#ffbd2e' : '#30d158';
      ctx.strokeStyle = colour; ctx.lineWidth = 3;
      ctx.strokeRect(x,y,w,h);
      ctx.fillStyle = colour; ctx.font = '600 15px system-ui';
      const tag = it.near != null ? `${it.label} ${it.near.toFixed(2)}` : it.label;
      ctx.fillText(tag, x+4, Math.max(15, y-5));
    }
  }
  lanesEl.forEach((el,i) =>
    el.style.background = blocked[i] ? '#ff5f56' : '#30d158');

  // ---- state; the obstacle is named from the sticky lane names ----
  const nL = laneName[0], nMid = laneName[1], nR = laneName[2];

  let state, msg;
  if (wallNow) {
    state = 'wall';    msg = 'Stop. Wall ahead';
  } else if (blocked[1] && advice === 'both') {
    state = 'midblock';
    msg = nMid ? `Middle path blocked, ${nMid}` : 'Middle path blocked';
  } else if (blocked[1] && (advice === 'left' || advice === 'right')) {
    state = 'divert';
    msg = nMid ? `${cap(nMid)} ahead, go ${advice}` : `Go ${advice}`;
  } else if (blocked[1]) {
    state = 'blocked';
    msg = nMid ? `Blocked ahead, ${nMid}` : 'Blocked ahead';
  } else if (blocked[0] && blocked[2]) {
    state = 'sides';
    msg = 'Obstacles both sides, keep straight';
  } else if (blocked[0]) {
    state = 'sideL';
    msg = `${cap(nL) || 'Obstacle'} left, keep straight`;
  } else if (blocked[2]) {
    state = 'sideR';
    msg = `${cap(nR) || 'Obstacle'} right, keep straight`;
  } else if (worst && worstNear) {
    state = 'note';
    msg = `${cap(worst.label)} ${sideWord(worst.cxn)}`;
  } else {
    state = 'clear';   msg = 'Clear';
  }

  // ---- majority vote ----
  voteBuf.push({ state, msg });
  if (voteBuf.length > CFG.voteWindow) voteBuf.shift();
  const tally = {};
  for (const v of voteBuf) tally[v.state] = (tally[v.state] || 0) + 1;
  let winner = null, best = 0;
  for (const k in tally) if (tally[k] > best) { best = tally[k]; winner = k; }

  if (voteBuf.length >= CFG.voteWindow && best / voteBuf.length >= CFG.voteMajority) {
    lastState = winner;
    // prefer the newest message for the winning state, which now carries
    // a sticky name even if detection blinked
    msg = [...voteBuf].reverse().find(v => v.state === winner).msg;
    if (winner !== 'clear') say(msg);
  }
  sayEl.textContent = (lastState === 'clear') ? '' : msg;
  sayEl.classList.toggle('wall', lastState === 'wall');

  // ---- tone ----
  if (wallNow) {
    tone(true, 1150, 0, 11);
  } else if (worst && worstNear) {
    const t = worst.near != null
      ? Math.min(1, Math.max(0, (worst.near - 0.4) / 0.6))
      : Math.min(1, worst.area / 0.30);
    tone(true, 420 + t*820, (worst.cxn*2-1), 2 + t*10);
  } else tone(false);

  // ---- hud ----
  const ms = performance.now() - t0;
  fps = fps ? fps*.85 + (1000/ms)*.15 : 1000/ms;
  hud.textContent =
    `${fps.toFixed(1)} fps  ${ms.toFixed(0)} ms  ${tf.getBackend()}` +
      (useDepth ? `  depth ${depthMs.toFixed(0)}ms` : '  depth off') + `\n` +
    `${items.length} obj  ${lastState}  ` +
    `L${laneAvg[0].toFixed(2)} C${laneAvg[1].toFixed(2)} R${laneAvg[2].toFixed(2)}` +
    (useDepth ? `  fit ${planarFit.toFixed(2)} gy ${gradY.toFixed(2)} ` +
                `gx ${gradX.toFixed(2)} lvl ${planarLevel.toFixed(2)}` +
                `${isWall ? ' WALL' : ''}` : '  [boxes]');

  requestAnimationFrame(loop);
}

// ===================== start =====================
document.getElementById('go').onclick = async () => {
  const b = document.getElementById('go');
  b.disabled = true; b.textContent = 'Starting...';
  try {
    unlockSpeech();
    audioInit();
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:640}, height:{ideal:480} },
      audio:false });
    vid.srcObject = stream;
    await vid.play();
    await new Promise(res => vid.readyState >= 2 ? res() : vid.onloadeddata = res);
    cvs.width = vid.videoWidth; cvs.height = vid.videoHeight;
    log(`Camera ${cvs.width}x${cvs.height}`, 'ok');

    await tf.setBackend('webgl'); await tf.ready();
    log(`Backend: ${tf.getBackend()}`, 'ok');

    log('Loading detector...');
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    log('Ready. Tap Depth for walls + distances.', 'ok');

    splash.style.display = 'none';
    running = true;
    loop();
  } catch(e) {
    log('FAILED: ' + e.message, 'err');
    b.disabled = false; b.textContent = 'Retry';
  }
};

document.getElementById('bSpeak').onclick = e => {
  speakOn = !speakOn; e.target.classList.toggle('on', speakOn);
  if (!speakOn) speechSynthesis.cancel();
};
document.getElementById('bTone').onclick = e => {
  toneOn = !toneOn; e.target.classList.toggle('on', toneOn);
};
document.getElementById('bBoxes').onclick = e => {
  boxesOn = !boxesOn; e.target.classList.toggle('on', boxesOn);
};
bDepth.onclick = async () => {
  if (depthOn) {
    depthOn = false; depthLanes = null; depthMap = null;
    isWall = false; flatCount = 0;
    bDepth.classList.remove('on');
    laneAvg = [0,0,0]; blockedState = [false,false,false];
    return;
  }
  if (!depthSession) {
    bDepth.classList.add('busy'); bDepth.textContent = '...';
    try { await loadDepth(); bDepth.textContent = 'Depth'; }
    catch (e) {
      bDepth.classList.remove('busy'); bDepth.textContent = 'Failed';
      alert('Depth load failed: ' + e.message); return;
    }
    bDepth.classList.remove('busy');
  }
  depthOn = true; depthLanes = null; depthMap = null;
  flatCount = 0; isWall = false;
  laneAvg = [0,0,0]; blockedState = [false,false,false];
  bDepth.classList.add('on');
};
</script>
</body>
